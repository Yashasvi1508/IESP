<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Management - IESP Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
        }


        /* ================= NAVBAR ================= */

        .navbar {

            min-height: 72px;

            background: linear-gradient(
                    135deg,
                    #172b4d,
                    #23448f
            );

            color: white;

            padding: 12px 45px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            box-shadow:
                    0 3px 12px rgba(0,0,0,0.15);
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;
        }


        .brand-icon {

            width: 40px;

            height: 40px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #1d5d8f;

            border-radius: 10px;

            font-size: 20px;
        }


        .brand-text {

            min-width: 0;
        }


        .brand-text h2 {

            margin: 0;

            font-size: 21px;

            white-space: nowrap;
        }


        .brand-text p {

            margin: 2px 0 0;

            font-size: 11px;

            color: #dbe7ff;

            white-space: nowrap;
        }


        .back-button {

            color: white;

            text-decoration: none;

            background: rgba(255,255,255,0.12);

            border: 1px solid rgba(255,255,255,0.2);

            padding: 9px 16px;

            border-radius: 7px;

            font-size: 14px;

            font-weight: 600;

            transition: 0.3s;

            white-space: nowrap;

            flex-shrink: 0;
        }


        .back-button:hover {

            background: white;

            color: #23448f;

            transform: translateY(-1px);
        }


        /* ================= CONTAINER ================= */

        .container {

            width: 90%;

            max-width: 1400px;

            margin: 40px auto;
        }


        .container h1 {

            color: #172b4d;

            font-size: 28px;

            margin: 0 0 20px;
        }


        /* ================= TABLE ================= */

        .table-container {

            width: 100%;

            background: white;

            border-radius: 10px;

            padding: 20px;

            box-shadow:
                    0 3px 12px rgba(23,43,77,0.08);

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;
        }


        table {

            width: 100%;

            min-width: 900px;

            border-collapse: collapse;

            table-layout: auto;
        }


        /* ================= TABLE HEADER ================= */

        th {

            background: linear-gradient(
                    135deg,
                    #172b4d,
                    #23448f
            );

            color: white;

            padding: 14px;

            text-align: left;

            font-size: 14px;

            font-weight: 600;

            white-space: nowrap;
        }


        /* ================= TABLE DATA ================= */

        td {

            padding: 14px;

            border-bottom: 1px solid #e1e6ee;

            font-size: 14px;

            white-space: nowrap;

            vertical-align: middle;
        }


        /* ================= TABLE HOVER ================= */

        tbody tr:hover {

            background: #f8faff;
        }


        /* ================= STATUS ================= */

        .status-active {

            color: #198754;

            font-weight: bold;
        }


        .status-blocked {

            color: #dc3545;

            font-weight: bold;
        }


        /* ================= BUTTONS ================= */

        button {

            border: none;

            padding: 9px 16px;

            border-radius: 6px;

            cursor: pointer;

            color: white;

            font-family: inherit;

            font-weight: 600;

            white-space: nowrap;
        }


        .block-button {

            background: #dc3545;
        }


        .unblock-button {

            background: #198754;
        }


        .admin-label {

            color: #777;

            font-weight: bold;
        }


        /* ================= TABLET ================= */

        @media (max-width: 900px) {

            .navbar {

                padding: 12px 25px;
            }


            .container {

                width: 94%;

                margin: 30px auto;
            }


            .container h1 {

                font-size: 26px;
            }


            .table-container {

                padding: 15px;

                border-radius: 10px;
            }


            table {

                min-width: 850px;
            }


            th {

                padding: 12px;

                font-size: 13px;
            }


            td {

                padding: 12px;

                font-size: 13px;
            }

        }


        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .navbar {

                padding: 12px 18px;

                gap: 12px;
            }


            .brand-text p {

                display: none;
            }


            .brand-text h2 {

                font-size: 19px;
            }


            .back-button {

                padding: 8px 11px;

                font-size: 12px;
            }


            .container {

                width: 94%;

                margin: 25px auto;
            }


            .container h1 {

                font-size: 24px;

                margin-bottom: 18px;
            }


            .table-container {

                padding: 10px;

                border-radius: 10px;

                overflow-x: auto;
            }


            /*
             * Keep all 8 columns.
             * User can swipe horizontally on phone.
             */

            table {

                min-width: 820px;
            }


            th {

                padding: 10px 11px;

                font-size: 12px;

                height: 40px;
            }


            td {

                padding: 10px 11px;

                font-size: 12px;

                height: 44px;
            }


            button {

                padding: 7px 11px;

                font-size: 11px;

                border-radius: 5px;
            }


            .status-active,
            .status-blocked,
            .admin-label {

                font-size: 12px;
            }

        }


        /* ================= SMALL MOBILE ================= */

        @media (max-width: 450px) {

            .navbar {

                padding: 10px 14px;
            }


            .brand {

                gap: 9px;
            }


            .brand-icon {

                width: 36px;

                height: 36px;

                font-size: 18px;

                border-radius: 8px;
            }


            .brand-text h2 {

                font-size: 17px;
            }


            .back-button {

                padding: 7px 9px;

                font-size: 11px;
            }


            .container {

                width: 94%;

                margin: 20px auto;
            }


            .container h1 {

                font-size: 22px;

                margin-bottom: 15px;
            }


            .table-container {

                padding: 8px;
            }


            table {

                min-width: 780px;
            }


            th {

                padding: 9px 10px;

                font-size: 11px;
            }


            td {

                padding: 9px 10px;

                font-size: 11px;
            }


            button {

                padding: 6px 10px;

                font-size: 10px;
            }


            .status-active,
            .status-blocked,
            .admin-label {

                font-size: 11px;
            }

        }


        /* ================= VERY SMALL MOBILE ================= */

        @media (max-width: 350px) {

            .navbar {

                flex-direction: column;

                align-items: stretch;

                padding: 12px;
            }


            .brand {

                justify-content: flex-start;
            }


            .back-button {

                width: 100%;

                text-align: center;

                padding: 9px;
            }


            .container {

                width: 94%;

                margin: 18px auto;
            }


            .container h1 {

                font-size: 21px;
            }


            .table-container {

                padding: 8px;
            }


            table {

                min-width: 780px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<div class="navbar">


    <div class="brand">

        <div class="brand-icon">
            🎓
        </div>


        <div class="brand-text">

            <h2>
                IESP Admin Panel
            </h2>

            <p>
                Interview & Employment Support Platform
            </p>

        </div>

    </div>


    <a href="/admin/dashboard"
       class="back-button">

        ← Dashboard

    </a>

</div>


<!-- ================= MAIN ================= -->

<div class="container">

    <h1>
        User Management
    </h1>


    <div class="table-container">


        <table>


            <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Email</th>

                <th>College</th>

                <th>Graduation Year</th>

                <th>Role</th>

                <th>Status</th>

                <th>Action</th>

            </tr>

            </thead>


            <tbody>


            <tr th:each="user : ${users}">


                <td th:text="${user.id}">
                    1
                </td>


                <td th:text="${user.name}">
                    User Name
                </td>


                <td th:text="${user.email}">
                    user@email.com
                </td>


                <td th:text="${user.college}">
                    College
                </td>


                <td th:text="${user.graduationYear}">
                    2026
                </td>


                <td>

                    <span th:if="${user.role == 'ADMIN'}"
                          class="admin-label">

                        ADMIN

                    </span>


                    <span th:unless="${user.role == 'ADMIN'}">

                        USER

                    </span>

                </td>


                <td>

                    <span th:if="${user.blocked}"
                          class="status-blocked">

                        Blocked

                    </span>


                    <span th:unless="${user.blocked}"
                          class="status-active">

                        Active

                    </span>

                </td>


                <td>


                    <!-- Don't show block/unblock for ADMIN -->

                    <span th:if="${user.role == 'ADMIN'}">

                        —

                    </span>


                    <form th:if="${user.role != 'ADMIN' && !user.blocked}"
                          th:action="@{/admin/users/block/{id}(id=${user.id})}"
                          method="post">


                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">


                        <button type="submit"
                                class="block-button"
                                onclick="return confirm('Are you sure you want to block this user?');">

                            Block

                        </button>


                    </form>


                    <form th:if="${user.role != 'ADMIN' && user.blocked}"
                          th:action="@{/admin/users/unblock/{id}(id=${user.id})}"
                          method="post">


                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">


                        <button type="submit"
                                class="unblock-button">

                            Unblock

                        </button>


                    </form>


                </td>


            </tr>


            </tbody>


        </table>


    </div>


</div>


</body>

</html>
