<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | IESP</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
            color: #172b4d;
        }

        .navbar {
            height: 70px;
            background: #172b4d;
            color: white;
            padding: 0 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
            font-size: 21px;
        }

        .back-button {
            color: white;
            text-decoration: none;
            background: #1d5d8f;
            padding: 9px 16px;
            border-radius: 6px;
            font-size: 14px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 45px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.08);
        }

        .card h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 27px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d6dce5;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1d5d8f;
        }

        .save-button {
            width: 100%;
            border: none;
            background: #172b4d;
            color: white;
            padding: 13px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .save-button:hover {
            background: #1d5d8f;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 0 20px;
            }

            .navbar h2 {
                font-size: 18px;
            }

            .container {
                width: 92%;
                margin: 30px auto;
            }

            .card {
                padding: 25px;
            }

            .card h1 {
                font-size: 23px;
            }
        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>IESP</h2>

    <a th:if="${user.role == 'ADMIN'}"
       href="/admin/dashboard"
       class="back-button">
        ← Dashboard
    </a>

    <a th:if="${user.role != 'ADMIN'}"
       href="/dashboard"
       class="back-button">
        ← Dashboard
    </a>

</div>


<div class="container">

    <div class="card">

        <h1>✏️ Edit Profile</h1>

        <p class="subtitle">
            Update your personal and academic details.
        </p>


        <div th:if="${param.success}"
             class="success">

            Profile updated successfully! ✓

        </div>


        <form th:action="@{/profile/edit}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input type="text"
                       id="name"
                       name="name"
                       th:value="${user.name}"
                       required>

            </div>


            <div class="form-group">

                <label for="college">
                    College
                </label>

                <input type="text"
                       id="college"
                       name="college"
                       th:value="${user.college}"
                       required>

            </div>


            <div class="form-group">

                <label for="graduationYear">
                    Graduation Year
                </label>

                <input type="number"
                       id="graduationYear"
                       name="graduationYear"
                       th:value="${user.graduationYear}"
                       required>

            </div>


            <button type="submit"
                    class="save-button">

                Save Changes

            </button>

        </form>

    </div>

</div>

</body>

</html>
